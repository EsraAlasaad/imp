<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bali | Paradise Portal</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">✦ طائر الشرق | TAYER ALSHAREQ<small>TRAVEL · DISCOVER · EXPERIENCE</small></div><nav class="nav"><a href="index.html">Overview</a><a class="active" href="indonesia.html">Indonesia</a></nav></header><main class="section"><a class="btn back" href="indonesia.html">← Back to Indonesia</a><div class="eyebrow">Indonesia · Bali</div><h2>Bali route map</h2><p><a class="btn" href="journey.html#bali">Open the Bali 3D journal ✦</a></p><p style="color:var(--muted)">A dedicated Bali map, separate from Jakarta.</p><div class="map-wrap"><img src="assets/bali-map.png" alt="Bali and nearby islands route map"></div></main><div class="sound-control" id="soundControl" role="button" tabindex="0" aria-label="Play ocean waves and Balinese music">♫ Play ambience</div>
<audio id="oceanAudio" loop preload="auto"><source src="assets/ocean-waves.mp3" type="audio/mpeg"></audio>
<audio id="baliAudio" loop preload="auto"><source src="assets/bali-gamelan.mp3" type="audio/mpeg"></audio>
<script>
(()=>{const b=document.getElementById('soundControl'),o=document.getElementById('oceanAudio'),m=document.getElementById('baliAudio');if(!b)return;o.volume=.32;m.volume=.18;let on=false;async function toggle(){if(!on){try{await Promise.all([o.play(),m.play()]);on=true;b.textContent='❚❚ Pause ambience';b.classList.add('playing')}catch(e){}}else{o.pause();m.pause();on=false;b.textContent='♫ Play ambience';b.classList.remove('playing')}}b.addEventListener('click',toggle);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})})();
</script></body></html>
